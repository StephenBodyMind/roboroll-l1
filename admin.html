<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>RoboRoll Message Board Admin</title>
    <link rel="stylesheet" href="./styles.css?v=20260614-1" />
  </head>
  <body class="admin-page">
    <main class="admin-shell">
      <header class="admin-header">
        <div><p class="kicker">RoboRoll team</p><h1>Message board admin</h1></div>
        <div class="admin-actions">
          <a class="text-link" href="./comments.html">Public board</a>
          <button id="admin-signout" class="secondary-button" type="button" hidden>Sign out</button>
        </div>
      </header>
      <section id="admin-login" class="admin-login">
        <h2>Team sign in</h2>
        <p>Use the administrator account created in Supabase Authentication.</p>
        <form id="admin-login-form">
          <div class="form-field"><label for="admin-email">Email</label><input id="admin-email" type="email" autocomplete="email" required /></div>
          <div class="form-field"><label for="admin-password">Password</label><input id="admin-password" type="password" autocomplete="current-password" required /></div>
          <button class="primary-button" type="submit">Sign in</button>
          <p id="admin-login-status" class="form-status" role="status"></p>
        </form>
      </section>
      <section id="admin-board" hidden>
        <div class="admin-board-head">
          <div><h2>Messages and replies</h2><p>Reply, feature, or hide messages from the public board.</p></div>
          <button id="admin-refresh" class="secondary-button" type="button">Refresh</button>
        </div>
        <div id="admin-comments" class="admin-comment-list"></div>
      </section>
    </main>
    <script src="./supabase-config.js?v=20260614-1"></script>
    <script type="module" src="./admin.js?v=20260614-1"></script>
  </body>
</html>
